<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>10 ans de Parcours le Monde IDF — Adhérer</title>
    <meta name="description" content="Parcours le Monde IDF fête ses 10 ans : découvrez le nouveau processus d'adhésion (10 € par an) et le Gala des 10 ans." />
    <meta name="theme-color" content="#F8EEDF" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="On fête nos 10 ans ! — Parcours le Monde IDF" />
    <meta property="og:description" content="Rejoins l'association : un tout nouveau processus d'adhésion, 10 € par an." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cette page nécessite JavaScript. Retrouvez-nous sur https://www.parcourslemonde.org/</noscript>
    <script>
      // Filet de sécurité : navigateur trop ancien ou application non démarrée.
      (function () {
        function warn() {
          if (document.getElementById('compat')) return
          var d = document.createElement('div')
          d.id = 'compat'
          d.setAttribute('role', 'alert')
          d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#51394E;color:#fff;padding:14px 16px;font:16px/1.4 system-ui,sans-serif;text-align:center'
          d.innerHTML = 'Votre navigateur semble trop ancien pour afficher correctement cette page. Mettez-le à jour ou rendez-vous sur <a href="https://www.parcourslemonde.org/" style="color:#fff;text-decoration:underline">parcourslemonde.org</a>.'
          document.body.appendChild(d)
        }
        var ok = window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)') && 'IntersectionObserver' in window
        if (!ok) warn()
        setTimeout(function () {
          var r = document.getElementById('root')
          if (r && !r.children.length) warn()
        }, 4000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
